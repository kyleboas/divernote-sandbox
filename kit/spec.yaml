schemaVersion: "2"
kind: sandbox
name: divernote-sandbox
version: "0.1.0"
displayName: Divernote sandbox
description: The coding agents Divernote runs on issues. Credentials stay on the Mac; the sandbox proxy adds them to requests.

extends: codex

environment:
  variables:
    DISABLE_TELEMETRY: "1"
    DISABLE_ERROR_REPORTING: "1"
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    PI_SKIP_VERSION_CHECK: "1"
    # Gems go in the home folder, so `bundle install` needs no sudo.
    BUNDLE_PATH: /home/agent/.bundle

setup:
  install:
    # A no-op when the sandbox starts from the template, which already has them.
    - command: "claude --version 2>/dev/null | grep -q '^2.1.284 ' && pi --version 2>/dev/null | grep -qx 0.87.0 || npm install -g @anthropic-ai/claude-code@2.1.284 @earendil-works/pi-coding-agent@0.87.0 --fetch-retries=5"
      user: "0"
      description: Install Claude Code and Pi
    # Ruby for Jekyll sites. The image's own startup runs apt-get too, hence the lock wait.
    - command: "command -v bundle >/dev/null || { apt-get -o DPkg::Lock::Timeout=300 update -qq && DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y -qq ruby-full ruby-bundler build-essential; }"
      user: "0"
      description: Install Ruby, Bundler and build tools

# Everything else is blocked. Add a host here when an agent needs it.
permissions:
  network:
    allow:
      # Claude
      - api.anthropic.com:443
      - platform.claude.com:443
      # Pi on a ChatGPT subscription
      - chatgpt.com:443
      - api.openai.com:443
      - auth.openai.com:443
      # GitHub: fetch, push, pull requests
      - github.com:443
      - api.github.com:443
      - codeload.github.com:443
      - objects.githubusercontent.com:443
      - raw.githubusercontent.com:443
      # Packages
      - registry.npmjs.org:443
      - rubygems.org:443
      - index.rubygems.org:443
